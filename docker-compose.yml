version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: insight_db
      POSTGRES_USER: insight_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://insight_user:postgres@db:5432/insight_db}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
